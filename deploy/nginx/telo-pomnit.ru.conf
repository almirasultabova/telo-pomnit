server {
    server_name telo-pomnit.ru www.telo-pomnit.ru;

    root /var/www/telo-site;
    index landing_final.html;

    location = / {
        try_files /landing_final.html =404;
    }

    location = /guide {
        try_files /gaid-body-stress.html =404;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location = /thanks {
        try_files /thanks.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/telo-pomnit.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/telo-pomnit.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.telo-pomnit.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = telo-pomnit.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name telo-pomnit.ru www.telo-pomnit.ru;
    return 404; # managed by Certbot
}
