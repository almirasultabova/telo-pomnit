<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J-APP-165 — сохранение копий</title><style>body{margin:24px;background:#f7f4ef;color:#2a4a38;font:16px/1.5 system-ui}main{display:flex;gap:24px;flex-wrap:wrap}iframe{width:390px;height:750px;max-width:90vw;border:1px solid #9c9f91;border-radius:24px;background:#f7f4ef}h1{font-size:24px}h2{font-size:18px}a{color:inherit}nav{margin:16px 0}</style><h1>Сохранение дневника и личных копий</h1><p>Учебный просмотр: настоящие данные не загружаются. PDF здесь — демонстрационный файл.</p><nav><a href="/review">Готовый PDF</a> · <a href="/review?mode=copy">Неотправленные записи</a> · <a id="full" href="/">Новый вариант отдельно</a></nav><main><section><h2>До — опубликованный вариант</h2><iframe id="before" title="До"></iframe></section><section><h2>После — только локально</h2><iframe id="after" title="После"></iframe></section></main><script>const mode=new URLSearchParams(location.search).get('mode')||'pdf';document.querySelector('#before').src='/before/index.html?mode='+mode;document.querySelector('#after').src='/index.html?mode='+mode;document.querySelector('#full').href='/index.html?mode='+mode</script></html>
